<!DOCTYPE html>
<html>
<head>
    <title>Ordered List</title>
</head>
<body>
<h2>Computer</h2>
<ol type="A">
    <li>DOS</li>
    <li>Windows 98</li>
</ol>
<ol start="5">
    <li>Word</li>
    <li>Excel</li>
</ol>
<ol type="i">
    <li>Word</li>
    <li>Excel</li>
</ol>
<ol type="I" start="7">
    <li>Word</li>
    <li>Excel</li>
</ol>
<ol type="1">
    <li>Word</li>
    <li>Excel</li>
</ol>
</body>
</html>
